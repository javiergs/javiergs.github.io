<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hanoi Study Dashboard</title>
  <meta name="description" content="Synchronized visualization of Tower of Hanoi behavior, EEG, affect, PAD, facial expression, motion, and device data." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Hanoi Study Dashboard</h1>
      <p class="subtitle">Synchronized behavioral and physiological data</p>
    </div>
    <div class="participant-picker">
      <label for="participantSelect">Participant</label>
      <select id="participantSelect" aria-label="Participant"></select>
      <button id="loadParticipant" type="button">Load</button>
    </div>
  </header>

  <main>
    <section class="card timeline-card">
      <div class="timeline-header">
        <div>
          <div class="eyebrow">Master timeline</div>
          <div id="clock" class="clock">--:--:--.---</div>
          <div id="elapsed" class="elapsed">Elapsed --</div>
        </div>
        <div class="controls">
          <button id="prevTrial" type="button">◀ Trial</button>
          <button id="prevMove" type="button">◀ Move</button>
          <button id="playPause" type="button">▶ Play</button>
          <button id="nextMove" type="button">Move ▶</button>
          <button id="nextTrial" type="button">Trial ▶</button>
          <label class="speed-label">Speed
            <select id="speedSelect">
              <option value="1">1×</option>
              <option value="5">5×</option>
              <option value="20" selected>20×</option>
              <option value="60">60×</option>
            </select>
          </label>
          <label class="view-label">View
            <select id="viewSelect">
              <option value="experiment" selected>Experiment ± 60 s</option>
              <option value="full">Full recording</option>
            </select>
          </label>
          <label class="chart-mode-label">Charts
            <select id="chartMode">
              <option value="raw" selected>Raw</option>
              <option value="smooth">Smoothed</option>
            </select>
          </label>
          <label class="smooth-label">Window
            <select id="smoothWindow" disabled>
              <option value="1">1 s</option>
              <option value="2">2 s</option>
              <option value="5" selected>5 s</option>
              <option value="10">10 s</option>
              <option value="30">30 s</option>
            </select>
          </label>
        </div>
      </div>

      <input id="timeSlider" class="time-slider" type="range" min="0" max="10000" value="0" step="1" aria-label="Experiment time" />
      <div class="range-labels"><span id="rangeStart">--</span><span id="rangeEnd">--</span></div>
      <canvas id="trialStrip" class="trial-strip" height="48"></canvas>
      <div id="status" class="status">Loading participant list…</div>
    </section>

    <section class="experiment-grid">
      <article class="card hanoi-card">
        <div class="panel-heading">
          <div>
            <div class="eyebrow">Behavior</div>
            <h2>Tower of Hanoi</h2>
          </div>
          <div id="trialBadge" class="badge neutral">Outside trial</div>
        </div>
        <div id="moveSummary" class="move-summary">Select a participant to begin.</div>
        <div id="hanoiBoard" class="hanoi-board" aria-label="Tower of Hanoi state"></div>
        <div class="move-meta">
          <div><span class="meta-label">Move</span><strong id="moveNumber">—</strong></div>
          <div><span class="meta-label">Duration</span><strong id="moveDuration">—</strong></div>
          <div><span class="meta-label">Help</span><strong id="helpUsed">—</strong></div>
          <div><span class="meta-label">Errors</span><strong id="errorsMove">—</strong></div>
        </div>
      </article>

      <article class="card snapshot-card">
        <div class="panel-heading">
          <div>
            <div class="eyebrow">At cursor</div>
            <h2>Current Snapshot</h2>
          </div>
        </div>
        <div id="snapshot" class="snapshot-grid"></div>
      </article>
    </section>

    <section id="charts" class="charts"></section>
  </main>

  <footer>
    <span>Hanoi Study Dashboard</span>
    <span id="footerParticipant"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
